<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOT POTATO: Bomb Squad</title><style>body{margin:0;background:#0c1027;color:white;font-family:system-ui;text-align:center}h1{color:#ffcf4d}main{max-width:850px;margin:auto;padding:15px}input,button{font:inherit;border:0;border-radius:10px;padding:12px;margin:5px}button{background:#ffcf4d;color:#17162d;font-weight:bold;cursor:pointer}input{width:130px}#arena{background:#191f42;border:3px solid #6270d3;border-radius:15px;width:100%;touch-action:none}#hud{display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px;margin:10px}.muted{color:#aeb6db}#controls{display:none}@media(pointer:coarse){#controls{display:block}#controls button{min-width:65px}}</style></head><body><main><h1>💣 HOT POTATO: BOMB SQUAD</h1><p class="muted">Pass the bomb. Dodge your friends. Be the last one standing.</p><section id="join"><input id="name" maxlength="14" placeholder="Nickname"><input id="room" maxlength="6" placeholder="Room code"><button id="create">Create Room</button><button id="joinBtn">Join Room</button></section><div id="status">Connect to a room to begin.</div><div id="hud"><span id="roomLabel"></span><span id="timer"></span><span id="players"></span></div><button id="start" hidden>Start Match (Host)</button><canvas id="arena" width="800" height="480"></canvas><div id="controls"><div><button data-key="ArrowUp">▲</button></div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><p class="muted">Move: WASD / arrow keys or touch buttons. Tag someone while holding the bomb to pass it.</p></main><script>
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');let ws,me='',state={players:[],phase:'lobby'},keys=new Set();function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}function connect(create){const name=$('name').value.trim()||'Player',room=$('room').value.trim().toUpperCase();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send({type:create?'create':'join',name,room});ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){me=m.id;$('room').value=m.room;$('join').hidden=true;$('roomLabel').textContent='Room: '+m.room;$('status').textContent='Share the room code with friends.'}if(m.type==='state'){state=m.state;$('players').textContent='Players: '+state.players.filter(p=>p.alive).length+'/'+state.players.length;$('timer').textContent=state.phase==='playing'?'💣 Fuse unknown — keep moving!':'Round '+state.round;$('start').hidden=!(state.host===me&&(state.phase==='lobby'||state.phase==='ended')&&state.players.length>=2);if(state.phase==='ended')$('status').textContent='🏆 '+(state.winner||'Nobody')+' wins! Host can start a rematch.';else if(state.phase==='playing')$('status').textContent=state.holder===me?'YOU HAVE THE BOMB! TAG SOMEONE!':'Avoid the bomb holder!';}if(m.type==='error')$('status').textContent=m.message};ws.onclose=()=>{$('status').textContent='Disconnected. Refresh to reconnect.'}}
$('create').onclick=()=>connect(true);$('joinBtn').onclick=()=>connect(false);$('start').onclick=()=>send({type:'start'});function key(k,on){if(on)keys.add(k);else keys.delete(k);send({type:'input',keys:[...keys]})}window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){e.preventDefault();key(e.key,true)}});window.addEventListener('keyup',e=>key(e.key,false));document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);key(b.dataset.key,true)};b.onpointerup=b.onpointercancel=()=>key(b.dataset.key,false)});
function draw(){ctx.clearRect(0,0,800,480);ctx.fillStyle='#191f42';ctx.fillRect(0,0,800,480);ctx.strokeStyle='#2a3462';for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}for(const p of state.players){if(!p.alive)continue;let bomb=p.id===state.holder;ctx.beginPath();ctx.arc(p.x,p.y,19,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.lineWidth=bomb?6:2;ctx.strokeStyle=bomb?'#ff5555':p.id===me?'white':'#7384c6';ctx.stroke();ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillText(p.name,p.x,p.y-29);if(bomb){ctx.font='25px system-ui';ctx.fillText('💣',p.x,p.y+9)}}if(state.phase==='lobby'){ctx.fillStyle='#fff';ctx.font='bold 26px system-ui';ctx.textAlign='center';ctx.fillText('Waiting for players...',400,240)}requestAnimationFrame(draw)}draw();
</script></body></html>
